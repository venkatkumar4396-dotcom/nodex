[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentflow"
version = "0.1.0"
description = "AgentFlow — visual AI agent workflow platform"
requires-python = ">=3.11"
dependencies = [
    # Core
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # LLM
    "litellm>=1.40",
    # Logging
    "structlog>=24.1",
    # Async utilities
    "anyio>=4.3",
    # Phase 4+ (FastAPI, DB, queue)
    # "fastapi>=0.111",
    # "uvicorn[standard]>=0.30",
    # "sqlalchemy[asyncio]>=2.0",
    # "asyncpg>=0.29",
    # "alembic>=1.13",
    # "arq>=0.26",
    # "redis>=5.0",
    # "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "mypy>=1.10",
    "ruff>=0.4",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
