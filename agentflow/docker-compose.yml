# ═══════════════════════════════════════════════════════════════════════════════
# AgentFlow — Docker Compose for Phase 4 infrastructure
# ═══════════════════════════════════════════════════════════════════════════════
# Spins up Postgres and Redis for local development.
#
# Usage:
#   docker compose up -d
#
# This gives you:
#   - PostgreSQL on localhost:5432 (user/pass: agentflow/agentflow, db: agentflow)
#   - Redis on localhost:6379

services:
  postgres:
    image: postgres:16-alpine
    container_name: agentflow-postgres
    environment:
      POSTGRES_USER: agentflow
      POSTGRES_PASSWORD: agentflow
      POSTGRES_DB: agentflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agentflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
